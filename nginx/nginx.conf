server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS so upstream hostnames are re-resolved after
    # container restarts (avoids stale-IP 502 on redeploy).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Django API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # ── Django admin & schema ─────────────────────────────────────────────────
    location /django-admin/ {
        proxy_pass http://api:8000/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin-panel/ {
        proxy_pass http://api:8000/admin-panel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Django static & media ─────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # ── Next.js frontend (port 3000) ──────────────────────────────────────────
    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;

        # Required for Next.js hot-reload SSE in dev (ignored in prod)
        proxy_buffering off;
        proxy_cache off;

        # WebSocket support (Next.js dev HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
